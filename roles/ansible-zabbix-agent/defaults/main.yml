---
# Default variables for Zabbix agent deployment

# Zabbix version - 7.0 for RHEL 8/9, 6.0 for RHEL 7
zabbix_version_default: "7.0"
zabbix_version_rhel7: "6.0"

# Package state
zabbix_agent_package_state: present

# Packages to install
zabbix_agent_packages:
  - zabbix-agent
  - zabbix-sender
  - zabbix-get

# Service name
zabbix_agent_service: "zabbix-agent"

# Repository URLs
zabbix_repo_url_rhel7: "https://repo.zabbix.com/zabbix/6.0/rhel/7/x86_64/zabbix-release-latest-6.0.el7.noarch.rpm"
zabbix_repo_url_rhel8: "https://repo.zabbix.com/zabbix/7.0/rhel/8/x86_64/zabbix-release-7.0-1.el8.noarch.rpm"
zabbix_repo_url_rhel9: "https://repo.zabbix.com/zabbix/7.0/rhel/9/x86_64/zabbix-release-7.0-5.el9.noarch.rpm"

# Debian/Ubuntu repository
zabbix_repo_key_url: "https://repo.zabbix.com/zabbix-official-repo.key"
zabbix_repo: "deb https://repo.zabbix.com/zabbix/7.0/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"

# Agent configuration
zabbix_agent_server: "monitor-proxy.vps.net"
zabbix_agent_serveractive: "monitor-proxy.vps.net"
zabbix_agent_listenport: 10050
zabbix_agent_hostname: "{{ inventory_hostname }}"

# Zabbix API settings
zabbix_url: "https://zabbix-uk.vps.net"
zabbix_proxy: "monitor-proxy.vps.net"

# SELinux settings
zabbix_selinux: false
selinux_allow_zabbix_run_sudo: false

# pip packages
zabbix_install_pip_packages: false

# apt settings for Debian
zabbix_apt_force_apt_get: true
zabbix_apt_install_recommends: false
