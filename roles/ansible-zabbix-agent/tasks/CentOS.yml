---
# CentOS specific tasks for Zabbix agent setup

- name: Add Zabbix repository for CentOS
  yum_repository:
    name: zabbix
    description: Zabbix Official Repository
    baseurl: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/rhel/{{ ansible_distribution_major_version }}/$basearch/"
    gpgcheck: no
    state: present

- name: Install Zabbix agent packages on CentOS
  package:
    name:
      - zabbix-agent
      - zabbix-sender
      - zabbix-get
    state: "{{ zabbix_agent_package_state }}"

- name: Ensure Zabbix agent is enabled and running on CentOS
  service:
    name: "{{ zabbix_agent_service }}"
    state: started
    enabled: yes

