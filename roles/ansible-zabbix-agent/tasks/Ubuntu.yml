---
# Ubuntu specific tasks for Zabbix agent setup

- name: Add Zabbix APT repository
  apt_repository:
    repo: "deb https://repo.zabbix.com/zabbix/{{ zabbix_version }}/ubuntu {{ ansible_distribution_release }} main"
    state: present
    filename: 'zabbix'
    update_cache: yes

- name: Add Zabbix APT GPG key
  apt_key:
    url: "https://repo.zabbix.com/zabbix-official-repo.key"
    state: present

- name: Install Zabbix agent packages on Ubuntu
  apt:
    name:
      - zabbix-agent
      - zabbix-sender
      - zabbix-get
    state: "{{ zabbix_agent_package_state }}"
    update_cache: yes

- name: Ensure Zabbix agent is enabled and running on Ubuntu
  service:
    name: "{{ zabbix_agent_service }}"
    state: started
    enabled: yes

