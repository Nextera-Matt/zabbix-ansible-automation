---
- name: Add Zabbix repository for RHEL
  yum_repository:
    name: zabbix
    description: Zabbix Official Repository
    baseurl: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/rhel/{{ ansible_distribution_major_version }}/$basearch/"
    gpgcheck: no
    state: present

- name: Install Zabbix agent packages on RHEL
  package:
    name:
      - zabbix-agent
      - zabbix-sender
      - zabbix-get
    state: present

- name: Enable and start Zabbix agent on RHEL
  service:
    name: zabbix-agent
    state: started
    enabled: yes

