---
- name: Add Zabbix repository for SUSE
  zypper_repository:
    name: zabbix
    description: Zabbix Official Repository
    repo: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/sles/{{ ansible_distribution_major_version }}/$basearch/"
    autorefresh: yes
    enabled: yes
    state: present

- name: Install Zabbix agent packages
  package:
    name:
      - zabbix-agent
      - zabbix-sender
      - zabbix-get
    state: "{{ zabbix_agent_package_state }}"

- name: Configure Zabbix agent using template
  template:
    src: zabbix_agentd.conf.j2
    dest: /etc/zabbix/zabbix_agentd.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Zabbix agent

